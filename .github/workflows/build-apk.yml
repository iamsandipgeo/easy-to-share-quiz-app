
name: Build Telegram Quiz Maker APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Package web app as Android APK
        uses: cemcoe/web-to-apk-action@v1
        with:
          app_name: "Telegram Bulk Quiz Maker"
          app_id: "com.rankerselite.bulkquizmaker"
          build_command: "npm install && npm run build"
          web_dir
          : "dist"
